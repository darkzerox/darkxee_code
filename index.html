<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Darkxee Code</title>
</head>

<body>

  <div class="contener">
    <h1>Darkxee Code</h1>
    <p>Convert text to Darkxee Code. Ex. Darkxee =&gt; LxviiiLxvLxxxiiLxxvLxxxviiiLxixLxixXxxii
      <br/>All Language !!</p>
    <div class="code_convert">
      <div class="col">
        <input type="text" id="encode">
        <button id="gen">ENCODE</button>
        <p class="encode-output"></p>
      </div>
      <div class="arrow">
        <button class="arrow-encode">
          <<</button>
            <button class="arrow-decode">>></button>
      </div>
      <div class="col">
        <input type="text" id="decode">
        <button id="dec">DECODE</button>
        <p class="decode-output"></p>
      </div>
    </div>
    <div class="version">V.2.0</div>
  </div>


</body>

<style lang="css">
  body * {
    box-sizing: border-box;
  }

  h1 {
    text-align: center;
  }

  p {
    padding-left: 15px;
  }

  input {
    width: 100%;
  }

  .arrow {
    display: flex;
    align-items: center;
  }

  button {
    float: right;
    margin: 10px 0;
  }

  .encode-output,
  .decode-output {
    word-break: break-word;
    border: solid 1px #ddd;
    padding: 5px;
    box-sizing: border-box;
    margin-top: 30px;
    min-height: 250px;
    clear: both;
  }

  .code_convert {
    display: flex;
    justify-content: space-between;
  }

  .col {
    padding: 15px;
    width: 100%;
  }

  .contener {
    max-width: 1200px;
    margin: auto;
    border: solid 1px #ddd;
    display: table;
    width: 100%;
  }

  textarea {
    width: 100%;
    min-height: 300px;
    margin-top: 15px;
    font-size: 16px;
  }

  .version {
    text-align: right;
    padding: 10px;
  }
</style>

<script src="https://code.jquery.com/jquery-3.2.1.min.js" integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4="
  crossorigin="anonymous"></script>
<script>
  function fromRoman(str) {
    var result = 0;
    // the result is now a number, not a string
    var decimal = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1];
    var roman = ["M", "CM", "D", "CD", "C", "XC", "L", "XL", "X", "IX", "V", "IV", "I"];
    for (var i = 0; i < decimal.length; i++) {
      while (str.indexOf(roman[i]) === 0) {
        result += decimal[i];
        str = str.replace(roman[i], '');
      }
    }
    return result;
  }

  function toRoman(num) {
    var result = '';
    var decimal = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1];
    var roman = ["M", "CM", "D", "CD", "C", "XC", "L", "XL", "X", "IX", "V", "IV", "I"];
    for (var i = 0; i < decimal.length; i++) {
      while (num % decimal[i] < num) {
        result += roman[i];
        num -= decimal[i];
      }
    }
    return result;
  }


  function dzx_decode(code) {
    if (!code) return ""; // Handle empty or null input
    var romanParts = [];
    var currentRomanPart = "";

    for (var i = 0; i < code.length; i++) {
      var char = code[i];
      if (currentRomanPart === "") {
        currentRomanPart += char;
      } else if (/[A-Z]/.test(char)) { // Check if char is an uppercase letter
        romanParts.push(currentRomanPart);
        currentRomanPart = char;
      } else {
        currentRomanPart += char;
      }
    }
    if (currentRomanPart) { // Push the last part if it exists
      romanParts.push(currentRomanPart);
    }

    var txt = "";
    for (var j = 0; j < romanParts.length; j++) {
      var part = romanParts[j];
      if (part === "Xxxii") {
        txt += " ";
      } else {
        // Ensure part is not empty before calling fromRoman, though current logic should prevent empty parts.
        if (part) { 
          let decimalVal = fromRoman(part.toUpperCase());
          txt += String.fromCharCode(decimalVal);
        }
      }
    }
    return txt;
  }

  function dzx_encode(str) {
    var toEncode = '';
    if (!str) return ""; // Handle empty or null input

    for (let i = 0; i < str.length; i++) {
      if (str[i] === ' ') {
        toEncode += "Xxxii";
      } else {
        var to_asscii = str[i].toUpperCase().charCodeAt(0);
        // Ensure to_asscii is a valid number for toRoman
        if (isNaN(to_asscii)) continue; // Skip if not a valid character code

        var toDZX = toRoman(to_asscii);
        if (toDZX === null || typeof toDZX === 'undefined') continue; // Skip if toRoman returns invalid

        toDZX = toDZX.toLowerCase();
        if (toDZX.length > 0) {
          toDZX = toDZX.charAt(0).toUpperCase() + toDZX.slice(1);
        } else {
          // This case should ideally not be reached if toRoman works correctly
          // and input str[i] is a typical character.
          // However, if toRoman could return empty for some valid ASCII,
          // this would prevent an error on charAt(0) of empty string.
          continue; 
        }
        toEncode += toDZX;
      }
    }
    return toEncode;
  }

  $('#decode').keypress(function (e) {
    if (e.which == 13) {
      $('#dec').click();
    }
  });
  $('#dec').click(function () {
    var de = $('#decode').val();
    $('.decode-output').text(dzx_decode(de));
  })

  $('#encode').keypress(function (e) {
    if (e.which == 13) {
      $('#gen').click();
    }
  });
  $('#gen').click(function () {
    var enc = $('#encode').val();
    $('.encode-output').text(dzx_encode(enc));
  })

  $('.arrow-decode').click(function(){
    $('#decode').val($('.encode-output').text());
    $('#dec').click();
  });

  $('.arrow-encode').click(function(){
    $('#encode').val($('.decode-output').text());
    $('#gen').click();
  });

  function runTests() {
    console.log("Running automated tests...");

    // Test Case 1: "Darkxee" (no space)
    let encoded1 = dzx_encode("Darkxee");
    let expectedEncoded1 = "LxviiiLxvLxxxiiLxxvLxxxviiiLxixLxix";
    let decoded1 = dzx_decode(expectedEncoded1);
    console.log("Test 1 - Encode 'Darkxee':", encoded1 === expectedEncoded1 ? "PASS" : "FAIL", "Expected:", expectedEncoded1, "Got:", encoded1);
    console.log("Test 1 - Decode back:", decoded1 === "Darkxee" ? "PASS" : "FAIL", "Expected:", "Darkxee", "Got:", decoded1);

    // Test Case 2: "Darkxee " (with space)
    let encoded2 = dzx_encode("Darkxee ");
    let expectedEncoded2 = "LxviiiLxvLxxxiiLxxvLxxxviiiLxixLxixXxxii";
    let decoded2 = dzx_decode(expectedEncoded2);
    console.log("Test 2 - Encode 'Darkxee ':", encoded2 === expectedEncoded2 ? "PASS" : "FAIL", "Expected:", expectedEncoded2, "Got:", encoded2);
    console.log("Test 2 - Decode back:", decoded2 === "Darkxee " ? "PASS" : "FAIL", "Expected:", "Darkxee ", "Got:", decoded2);

    // Test Case 3: "Hello World"
    let encoded3 = dzx_encode("Hello World");
    let expectedEncoded3 = "LxxiiLxixLxxviLxxviLxxixXxxiiLxxxviiLxxixLxxxiiLxxviLxviii";
    let decoded3 = dzx_decode(expectedEncoded3);
    console.log("Test 3 - Encode 'Hello World':", encoded3 === expectedEncoded3 ? "PASS" : "FAIL", "Expected:", expectedEncoded3, "Got:", encoded3);
    console.log("Test 3 - Decode back:", decoded3 === "Hello World" ? "PASS" : "FAIL", "Expected:", "Hello World", "Got:", decoded3);

    // Test Case 4: Empty String ""
    let encoded4 = dzx_encode("");
    let decoded4 = dzx_decode("");
    console.log("Test 4 - Encode '':", encoded4 === "" ? "PASS" : "FAIL", "Expected:", "\"\"", "Got:", encoded4);
    console.log("Test 4 - Decode '':", decoded4 === "" ? "PASS" : "FAIL", "Expected:", "\"\"", "Got:", decoded4);

    // Test Case 5: "   " (three spaces)
    let encoded5 = dzx_encode("   ");
    let expectedEncoded5 = "XxxiiXxxiiXxxii";
    let decoded5 = dzx_decode(expectedEncoded5);
    console.log("Test 5 - Encode '   ':", encoded5 === expectedEncoded5 ? "PASS" : "FAIL", "Expected:", expectedEncoded5, "Got:", encoded5);
    console.log("Test 5 - Decode back:", decoded5 === "   " ? "PASS" : "FAIL", "Expected:", "\"   \"", "Got:", decoded5);

    // Test Case 6: Mixed Case "TeSt"
    // dzx_encode converts input to uppercase before getting charCodeAt, so "TeSt" becomes "TEST" effectively.
    let encoded6 = dzx_encode("TeSt"); 
    let expectedEncoded6 = "LxxxivLxixLxxxiiiLxxxiv"; // Roman for "TEST"
    let decoded6 = dzx_decode(expectedEncoded6);
    console.log("Test 6 - Encode 'TeSt':", encoded6 === expectedEncoded6 ? "PASS" : "FAIL", "Expected:", expectedEncoded6, "Got:", encoded6);
    // Decoding "LxxxivLxixLxxxiiiLxxxiv" should result in "TEST" because fromRoman gives ASCII for uppercase chars.
    console.log("Test 6 - Decode back to 'TEST':", decoded6 === "TEST" ? "PASS" : "FAIL", "Expected:", "TEST", "Got:", decoded6);

    console.log("Finished automated tests.");
  }

  runTests();

</script>


</html>
